# CROSS-REFERENCES
################################################################################

cross_references:
  frontend_boundary:
    path: "rules_frontend_boundary.yaml"
    relationship: "Import boundary enforcement - UI cannot import backend processing modules"

  exception_handling:
    path: "rules_exception_handling.yaml"
