  structured_logging:
    path: "rules_structured_logging.yaml"
    relationship: "Logging patterns for UI error handling"

################################################################################
# SUMMARY
################################################################################

summary: |
  The UI layer in PhilOcr must remain a thin delegation wrapper:

  1. **UI methods should be short** (≤15 lines, ≤25 with exception handling)
  2. **Delegate business logic** to workers layer
  3. **Use signals/slots** for async communication
  4. **Handle UI concerns only**: widgets, dialogs, user feedback, state management
  5. **Keep processing logic** out of UI code

  This architecture enables:
  - Testable business logic (without UI dependencies)
  - Reusable workers (for headless/CLI modes)
  - Maintainable separation of concerns
  - Flexible UI implementations

  Remember: If you're writing complex logic in a UI method, ask "Does this belong in a worker?"

canonical_notice: |
  This is the canonical UI purity guide for the PhilOcr codebase.

  All UI layer code in src/philocr/ui/ must follow these standards. The UI layer
  must remain a thin delegation wrapper that delegates business logic to workers
  and utils layers.

  For import boundary enforcement, see: rules_frontend_boundary.yaml
  For exception handling patterns, see: rules_exception_handling.yaml
