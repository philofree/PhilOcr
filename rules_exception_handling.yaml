################################################################################
# SUMMARY
################################################################################

summary: |
  ZERO TOLERANCE POLICY - ABSOLUTELY NO EXCEPTIONS:
  
  1. **Fail fast, not silent** - Errors must be visible and logged (ZERO TOLERANCE)
  2. **No graceful degradation** - Do NOT attempt to continue with degraded functionality (ZERO TOLERANCE)
  3. **No error swallowing** - ALL exceptions must be logged and re-raised (ZERO TOLERANCE)
  4. **Specific exceptions** - Catch only what you can handle
  5. **Re-raise by default** - Unless you're handling the error properly
  6. **Align intent** - Don't contradict function's documented fail-fast behavior
  7. **Transient errors only** - Only ConnectionError for partial failure tolerance (and even then, fail fast if rate is too high)
  8. **Log before exit** - Top-level handlers must log and flush before re-raising

  **ZERO TOLERANCE REMINDER:** Silent failures, graceful degradation, and error
  swallowing are ABSOLUTELY FORBIDDEN. A crashed system is visible and can be fixed.
  A silently failing system creates corrupt state that manifests later. For OCR
  processing: silent failures mean corrupted text extraction, lost Greek characters,
  or incomplete PDF processing that only becomes apparent when users examine the output.
  
  This policy has NO exceptions.

################################################################################
# CANONICAL NOTICE
################################################################################

canonical_notice: |
  This is the canonical exception handling guide for the PhilOcr codebase.

  All exception handling in PhilOcr follows these standards. Any deviation must be
  justified and documented.

  For logging patterns, see: rules_structured_logging.yaml
  For verification doctrine, see: rules_verification_snagging_shakedown.yaml

  This document is adapted from another codebase's exception handling norms and
  customized for PhilOcr's specific context of OCR processing for ancient Greek texts.

  Key adaptations:
  - Document AI API error handling instead of database errors
  - PDF processing and OCR workflow examples
  - PyQt6 UI integration patterns
  - Greek Unicode and text extraction error scenarios
  - OCR-specific error handling (page processing, text extraction, format conversion)