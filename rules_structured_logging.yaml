################################################################################
# COMMON MISTAKES TO AVOID
################################################################################

common_mistakes:
  - "Using 'event' as keyword - Will crash immediately"
  - "Multiple configuration calls - Causes inconsistent behavior"
  - "Forgetting to reassign bound loggers - Context gets lost"
  - "Module-level binding - Executes before configuration"
  - "Traditional message formatting - Loses structure and queryability"
  - "Generic event names - Useless for analysis"
  - "Re-raising without flushing logger - Logs might not be written before exit"
  - "Main loops without exception handlers - Process crashes silently"

################################################################################
# SUMMARY
################################################################################

summary: |
  Structlog is simple when used correctly:
  1. Configure once at startup in `main.py`
  2. Event name is first positional argument
  3. Context as keyword arguments
  4. Never use "event" as a keyword
  5. Bind creates new loggers (reassign them)
  6. Flush logger before re-raising in critical paths
  7. Clear context at boundaries (if applicable)

