canonical_notice: |
  This defines PhilOcr's verification doctrine and implementation methodology.

  Every feature follows: BUILD → WIRE → SNAGGING-SHAKEDOWN → COMPLETE

  Verification is whole-system, telemetry-driven, grounded in real OCR operation
  with real PDFs and real Document AI API calls. ALL exceptions are logged.
  
  For OCR systems: verification means processing real scanned Greek texts and
  verifying actual text extraction, Unicode preservation, structure handling,
  and output format correctness.

  This document is adapted from Sentinel verification doctrine for PhilOcr's
  specific context of OCR processing for ancient Greek texts.

  Key adaptations:
  - Google Document AI API instead of OpenAI/ArangoDB
  - PDF processing and text extraction workflows
  - PyQt6 UI integration verification
  - Greek Unicode and polytonic character handling
