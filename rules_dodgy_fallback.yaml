################################################################################
# SUMMARY
################################################################################

summary: |
  ZERO TOLERANCE POLICY - ABSOLUTELY NO EXCEPTIONS:
  
  PhilOcr has a ZERO TOLERANCE policy for dodgy fallbacks, silent fallbacks, and
  graceful degradation. ALL infrastructure failures MUST fail loudly and immediately.

  1. **Infrastructure must fail loudly** - No silent creation of managers, clients, processors (ZERO TOLERANCE)
  2. **No graceful degradation** - Do NOT attempt to continue with default/degraded infrastructure (ZERO TOLERANCE)
  3. **No dodgy fallbacks** - Do NOT create infrastructure in fallback patterns (ZERO TOLERANCE)
  4. **Use explicit validation** - Check for None and raise descriptive errors
  5. **Dependency injection** - Require infrastructure as explicit parameters
  6. **Explicit initialization** - Use initialization methods, not lazy creation
  7. **Simple defaults OK** - Non-infrastructure defaults (numbers, strings, booleans) are acceptable

  ABSOLUTELY FORBIDDEN patterns (ZERO TOLERANCE):
  - `x or SomeManager()` - ❌ Creates infrastructure silently (FORBIDDEN)
  - `x if cond else SomeClient()` - ❌ Creates infrastructure silently (FORBIDDEN)
  - `dict.get('key', SomeProcessor())` - ❌ Creates infrastructure silently (FORBIDDEN)
  - `getattr(obj, 'attr', SomeHandler())` - ❌ Creates infrastructure silently (FORBIDDEN)
  - Lazy initialization without validation - ❌ Graceful degradation (FORBIDDEN)

  This ZERO TOLERANCE policy ensures:
  - Configuration errors are visible immediately (no hiding)
  - System failures are explicit, not hidden (no graceful degradation)
  - Debugging is easier (clear error messages)
  - Production issues are easier to diagnose (fail fast, fail loud)

  **ZERO TOLERANCE REMINDER:** If infrastructure is missing, the system MUST fail
  to start immediately with a clear error. Do NOT silently create a default instance.
  Do NOT attempt graceful degradation. This policy has NO exceptions.

canonical_notice: |
  This is the canonical dodgy fallback prevention guide for the PhilOcr codebase.

  All code must avoid silent fallback creation of infrastructure components.
  Infrastructure must fail loudly when missing or misconfigured, enabling
  immediate detection and diagnosis of configuration errors.

  For fail-fast philosophy, see: rules_exception_handling.yaml
  For dependency patterns, see: rules_ui_purity.yaml and rules_frontend_boundary.yaml
