################################################################################
# SUMMARY
################################################################################

summary: |
  PhilOcr enforces strict separation between frontend (UI) and backend (processing) layers:

  1. **UI cannot import processing** - Use workers as boundary components
  2. **Backend cannot import UI** - Backend must remain UI-agnostic
  3. **Utils are cross-cutting** - Both layers can use utilities
  4. **Workers are boundary** - UI can import workers (they bridge to processing)
  5. **Models are shared** - Data models can be imported by both layers
  6. **Entry points are exception** - main.py can import UI to bootstrap application

  This architecture enables:
  - Testable backend (without UI dependencies)
  - Headless operation (backend can run standalone)
  - Reusable processing logic (across different UI implementations)
  - Clear boundaries (prevents circular dependencies)

  Remember: If UI needs processing functionality, use a worker. If backend
  needs UI functionality, refactor - backend should be UI-agnostic.

canonical_notice: |
  This is the canonical frontend-backend boundary guide for the PhilOcr codebase.

  All code must follow these import boundary rules. UI and processing layers
  must remain strictly separated, with workers serving as the boundary interface.

  For UI layer architecture, see: rules_ui_purity.yaml
  For exception handling at boundaries, see: rules_exception_handling.yaml
